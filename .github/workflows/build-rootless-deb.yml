name: Build Rootless DEB

# 只在 main 出 deb；分支出 IPA 见 build-ipa.yml
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # === 编译打包 —— 产出 iphoneos-arm64 rootless deb ===
  build:
    name: 编译打包
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/.theos-src
      # 参考项目 VirtualMacOniPad 的发布包，里面是已验证可加载的 Hypervisor.framework
      VM_REF_DEB_URL: https://github.com/nfzerox/VirtualMacOniPad/releases/download/1.2.3/VirtualMac_1.2.3.deb
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 ldid 与 dpkg
        run: brew install ldid dpkg

      - name: 克隆并配置 Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 校验打包元数据
        run: |
          set -euo pipefail
          grep -q '^Architecture: iphoneos-arm64$' control
          grep -q 'firmware (<< 16.4)' control
          plutil -lint Resources/Info.plist entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Resources/Info.plist)" = "14.0"
          test -x layout/DEBIAN/postinst
          test -x layout/DEBIAN/postrm
          # 装完要能请求安装器重启 SpringBoard，否则图标不会出现在主屏
          grep -q 'finish:restart' layout/DEBIAN/postinst

      - name: 编译并打包 rootless deb
        run: make package FINALPACKAGE=1

      - name: 校验 deb 架构与包内路径
        run: |
          set -euo pipefail
          deb="$(ls packages/*.deb | head -1)"
          echo "产物：$deb"
          dpkg-deb -f "$deb" Architecture | grep -qx iphoneos-arm64
          dpkg-deb -f "$deb" Version
          listing="$(dpkg-deb -c "$deb")"
          echo "$listing"
          grep -q 'var/jb/Applications/VirtualLinux.app/VirtualLinux' <<<"$listing"
          grep -q 'var/jb/Applications/VirtualLinux.app/Info.plist' <<<"$listing"
          # 维护脚本必须真进包，并且带上重启 SpringBoard 的回报
          rm -rf /tmp/deb-control
          dpkg-deb -e "$deb" /tmp/deb-control
          test -x /tmp/deb-control/postinst
          grep -q 'finish:restart' /tmp/deb-control/postinst
          grep -q 'finish:restart' /tmp/deb-control/postrm

      - name: 注入 Hypervisor 框架并重签
        run: |
          set -euo pipefail
          deb="$(ls packages/*.deb | head -1)"
          mkdir -p /tmp/vm-ref /tmp/vl-root
          curl -fsSL -o /tmp/vm-ref/vm.deb "$VM_REF_DEB_URL"
          ( cd /tmp/vm-ref && ar x vm.deb && mkdir -p payload && tar -xf data.tar.xz -C payload )
          framework="/tmp/vm-ref/payload/var/root/VirtualMac/payload/Frameworks/Hypervisor.framework"
          test -f "$framework/Hypervisor"
          dpkg-deb -R "$deb" /tmp/vl-root
          app="/tmp/vl-root/var/jb/Applications/VirtualLinux.app"
          mkdir -p "$app/Frameworks"
          cp -R "$framework" "$app/Frameworks/"
          # 必须用 codesign：ldid 会重建 LINKEDIT，把 chained fixups 弄丢，dlopen 时进程直接被 AMFI 杀掉
          codesign --force --sign - --entitlements entitlements.plist "$app/VirtualLinux"
          dpkg-deb --root-owner-group -b /tmp/vl-root "/tmp/$(basename "$deb")"
          mv "/tmp/$(basename "$deb")" "$deb"
          echo "已注入框架：$deb"

      - name: 校验注入结果
        run: |
          set -euo pipefail
          deb="$(ls packages/*.deb | head -1)"
          listing="$(dpkg-deb -c "$deb")"
          grep -q 'Applications/VirtualLinux.app/Frameworks/Hypervisor.framework/' <<<"$listing"
          rm -rf /tmp/vl-check
          dpkg-deb -R "$deb" /tmp/vl-check
          bin=/tmp/vl-check/var/jb/Applications/VirtualLinux.app/VirtualLinux
          # chained fixups 必须在：缺了它 dyld 无法绑定指针，加载即崩
          otool -l "$bin" | grep -q LC_DYLD_CHAINED_FIXUPS
          otool -l "$(dirname "$bin")/Frameworks/Hypervisor.framework/Hypervisor" | grep -q LC_DYLD_CHAINED_FIXUPS
          # 加载 ad-hoc 签名的第三方二进制需要这条权限
          ldid -e "$bin" | grep -q can-execute-cdhash
          ldid -e "$bin" | grep -q com.apple.private.hypervisor

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLinux-DEB
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: 汇总编译错误（失败时）
        if: failure()
        run: |
          echo "编译或打包失败，检查上方各步骤输出。"
          if compgen -G "packages/*.deb" > /dev/null; then
            ls -l packages
          else
            echo "未生成任何 deb。"
          fi

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .theos/
            packages/
          if-no-files-found: warn
          retention-days: 7
